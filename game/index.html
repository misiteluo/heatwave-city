<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatwave City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2231; font-family: system-ui, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #ui .overlay { pointer-events: auto; }
  .minimap { position: absolute; top: 14px; left: 14px; width: 190px; height: 190px; border-radius: 10px; border: 2px solid rgba(255,255,255,.55); box-shadow: 0 4px 18px rgba(0,0,0,.4); display: none; }
  .banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 62%; padding: 9px 22px; border-radius: 999px; background: rgba(10,26,38,.72); color: #ffd873; font-weight: 700; font-size: 17px; letter-spacing: .02em; text-align: center; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .stars { position: absolute; top: 12px; right: 18px; font-size: 30px; display: none; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .star { color: rgba(255,255,255,.28); margin-left: 2px; }
  .star.on { color: #ffc93c; }
  .stats { position: absolute; left: 16px; bottom: 16px; display: none; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,.6); }
  .cash { font-size: 26px; font-weight: 800; color: #7dff8a; }
  .hpwrap { width: 190px; height: 13px; margin-top: 5px; border-radius: 7px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); overflow: hidden; }
  .hpbar { height: 100%; width: 100%; background: #51e05e; transition: width .15s; }
  .ammo { margin-top: 5px; font-size: 14px; font-weight: 700; letter-spacing: .06em; color: #ffe9a8; }
  .speed { position: absolute; right: 20px; bottom: 18px; font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.65); display: none; }
  .prompt { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); padding: 8px 18px; border-radius: 8px; background: rgba(10,26,38,.78); color: #fff; font-size: 16px; font-weight: 600; display: none; }
  .toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); max-width: 70%; padding: 10px 20px; border-radius: 10px; background: rgba(10,26,38,.82); color: #fff; font-size: 17px; font-weight: 600; text-align: center; opacity: 0; transition: opacity .3s; }
  .crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,.85); font-size: 20px; font-weight: 300; display: none; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 52%, rgba(200,20,10,.55) 100%); opacity: 0; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(8,24,38,.25), rgba(8,24,38,.68)); color: #fff; text-align: center; padding: 20px; }
  .overlay.small { background: rgba(8,20,32,.55); }
  .gametitle { font-size: 64px; font-weight: 900; letter-spacing: .04em; color: #ffc93c; text-shadow: 0 4px 0 #d95f4b, 0 10px 28px rgba(0,0,0,.55); }
  .tagline { font-size: 20px; font-weight: 600; color: #dff3ff; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .story { max-width: 560px; font-size: 16px; line-height: 1.5; color: #eef7ff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .overtitle { font-size: 52px; font-weight: 900; letter-spacing: .06em; text-shadow: 0 6px 22px rgba(0,0,0,.6); }
  .btnrow { display: flex; gap: 14px; margin: 18px 0 8px; }
  .btn { pointer-events: auto; font-size: 18px; font-weight: 800; padding: 12px 30px; border: none; border-radius: 999px; background: #ffc93c; color: #40260a; cursor: pointer; box-shadow: 0 5px 16px rgba(0,0,0,.4); }
  .btn:hover { background: #ffd873; }
  .btn:disabled { background: #8d97a3; color: #e5ebf0; cursor: default; }
  .controls { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.85); max-width: 640px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="game" aria-label="Heatwave City: a 3D open-world crime game"></canvas>
<div id="ui"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
